name: Build, push to AWS ECR, and deploy
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *" # Nightly commit so the build picks up the latest GeoLite2 database
  workflow_dispatch:

env:
  DOCKER_SLUG: public.ecr.aws/cds-snc/notify-ipv4-geolocate-webservice

permissions:
  id-token: write   # This is required for requesting the OIDC JWT
  contents: read    # This is required for actions/checkout

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and push
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Install AWS CLI
      run: |
        curl --fail -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -q awscliv2.zip
        sudo ./aws/install --update
        aws --version

    - name: Configure credentials to CDS public ECR using OIDC
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
      with:
        role-to-assume: arn:aws:iam::283582579564:role/ipv4-geolocate-webservice-apply
        role-session-name: Ipv4GeolocateWebserviceGitHubActions
        aws-region: "us-east-1"

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      with:
        registry-type: public

    - name: Set Docker Tag
      id: image-tag
      run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      env:
        GITHUB_SHA: ${{ github.sha }}

    - name: Build container
      env:
        MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      run: |
        docker build \
        --build-arg "LICENSE_KEY=$MAXMIND_LICENSE_KEY" \
        -t $DOCKER_SLUG:${{ steps.image-tag.outputs.tag }} .

    - name: Publish
      run: |
        docker push $DOCKER_SLUG:${{ steps.image-tag.outputs.tag }}

    - name: Update images in staging
      run: |
        curl --fail-with-body -sS -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.MANIFESTS_WORKFLOW_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/cds-snc/notification-manifests/dispatches \
          -d '{"event_type":"update-docker-image","client_payload":{"component":"IPV4","docker_tag":"${{ steps.image-tag.outputs.tag }}"}}'

    - name: Create Notify PR Bot token
      id: notify-pr-bot
      uses: getsentry/action-github-app-token@97c9e23528286821f97fba885c1b1123284b29cc # v2.0.0
      with:
        app_id: ${{ secrets.NOTIFY_PR_BOT_APP_ID }}
        private_key: ${{ secrets.NOTIFY_PR_BOT_PRIVATE_KEY }}
        scope: cds-snc

    - uses: cds-snc/notification-pr-bot@main # zizmor: ignore[unpinned-uses] First-party bot intentionally tracks main.
      env:
        TOKEN: ${{ steps.notify-pr-bot.outputs.token }}

    - name: Notify Slack channel if this job failed
      if: ${{ failure() }}
      run: |
        json='{"text":"<!here> CI is failing in <https://github.com/cds-snc/ipv4-geolocate-webservice/actions/runs/'${{ github.run_id }}'|ipv4-geolocate-webservice> !"}'
        curl --fail-with-body -sS -X POST -H 'Content-type: application/json' --data "$json"  ${{ secrets.SLACK_WEBHOOK }}

  # The commit below is a normal push to main, which runs the deploy job above
  # so each nightly image gets its own sha7 tag.
  nightly-commit:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    name: Nightly rebuild commit
    steps:
    - name: Obtain a Notify PR Bot GitHub App Installation Access Token
      run: |
        TOKEN="$(npx obtain-github-app-installation-access-token@1.1.0 ci ${{ secrets.PR_BOT_GITHUB_TOKEN }})"
        echo "::add-mask::$TOKEN"
        echo "GITHUB_TOKEN=$TOKEN" >> $GITHUB_ENV

    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        token: ${{ env.GITHUB_TOKEN }}
        ref: main

    - name: Update rebuild marker
      run: date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/nightly-rebuild

    - name: Branch protection OFF
      uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
      with:
        route: PUT /repos/:repository/branches/main/protection
        repository: ${{ github.repository }}
        required_status_checks: |
          null
        enforce_admins: |
          null
        required_pull_request_reviews: |
          null
        restrictions: |
          null
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Commit
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        github-token: ${{ env.GITHUB_TOKEN }}
        script: |
          const fs = require("fs");
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          const { repository } = await github.graphql(
            `query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                ref(qualifiedName: "refs/heads/main") { target { ... on Commit { oid } } }
              }
            }`,
            { owner, repo }
          );
          await github.graphql(
            `mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) { commit { oid } }
            }`,
            {
              input: {
                branch: { repositoryNameWithOwner: `${owner}/${repo}`, branchName: "main" },
                message: { headline: "chore: nightly rebuild for GeoLite2 database refresh" },
                expectedHeadOid: repository.ref.target.oid,
                fileChanges: {
                  additions: [{ path: ".github/nightly-rebuild", contents: fs.readFileSync(".github/nightly-rebuild").toString("base64") }],
                },
              },
            }
          );

    - name: Branch protection ON
      if: always()
      uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
      with:
        route: PUT /repos/:repository/branches/main/protection
        repository: ${{ github.repository }}
        required_status_checks: |
          strict: false
          contexts: []
        enforce_admins: |
          true
        required_pull_request_reviews: |
          required_approving_review_count: 1
        restrictions: |
          null
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Notify Slack channel if this job failed
      if: ${{ failure() }}
      run: |
        json='{"text":"<!here> Nightly rebuild is failing in <https://github.com/cds-snc/ipv4-geolocate-webservice/actions/runs/'${{ github.run_id }}'|ipv4-geolocate-webservice> !"}'
        curl --fail-with-body -sS -X POST -H 'Content-type: application/json' --data "$json"  ${{ secrets.SLACK_WEBHOOK }}
