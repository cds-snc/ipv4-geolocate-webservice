name: Build and publish IPv4 image
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_SLUG: public.ecr.aws/cds-snc/notify-ipv4-geolocate-webservice

permissions:
  id-token: write
  contents: read

concurrency:
  group: ipv4-image-publish-main
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: Build and push
    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: Set image tag
      id: image-tag
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: |
        echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Install AWS CLI
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -q awscliv2.zip
        sudo ./aws/install --update
        aws --version

    - name: Configure credentials to CDS public ECR using OIDC
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
      with:
        role-to-assume: arn:aws:iam::283582579564:role/ipv4-geolocate-webservice-apply
        role-session-name: Ipv4GeolocateWebserviceGitHubActions
        aws-region: "us-east-1"
  
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      with:
        registry-type: public

    - name: Build
      env:
        IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      run: |
        docker build --build-arg "LICENSE_KEY=$MAXMIND_LICENSE_KEY" -t "$DOCKER_SLUG:$IMAGE_TAG" .

    - name: Publish
      env:
        IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
      run: |
        docker push "$DOCKER_SLUG:$IMAGE_TAG"

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Update dev and staging image tags
      env:
        MANIFESTS_WORKFLOW_TOKEN: ${{ secrets.MANIFESTS_WORKFLOW_TOKEN }}
        IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      run: |
        curl --fail-with-body -sS -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $MANIFESTS_WORKFLOW_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/cds-snc/notification-manifests/dispatches \
          -d "$(jq -n --arg tag "$IMAGE_TAG" '{event_type: "update-docker-image", client_payload: {component: "IPV4", docker_tag: $tag}}')"

  generate-sbom:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Generate Docker SBOM
      uses: cds-snc/security-tools/.github/actions/generate-sbom@12a0cdea1c5a515dfcbe353693db804a1793c0ed # v4.0.1
      env:
        TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}
      with:
        docker_image: "${{ env.DOCKER_SLUG }}:${{ needs.build-and-push.outputs.image_tag }}"
        dockerfile_path: Dockerfile
        sbom_name: notification-ipv4-geolocate-webservice
        token: ${{ secrets.GITHUB_TOKEN }}

  create-production-pr:
    needs: [build-and-push, update-manifests]
    runs-on: ubuntu-latest
    steps:
    - name: Create Notify PR Bot token
      id: notify-pr-bot
      uses: getsentry/action-github-app-token@97c9e23528286821f97fba885c1b1123284b29cc # v2.0.0
      with:
        app_id: ${{ secrets.NOTIFY_PR_BOT_APP_ID }}
        private_key: ${{ secrets.NOTIFY_PR_BOT_PRIVATE_KEY }}
        scope: cds-snc

    - name: Create production release PR
      uses: cds-snc/notification-pr-bot@main # zizmor: ignore[unpinned-uses] First-party bot intentionally tracks main.
      env:
        TOKEN: ${{ steps.notify-pr-bot.outputs.token }}
