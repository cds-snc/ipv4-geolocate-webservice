name: Build, publish, and update manifests on schedule
on:
  push:
    branches:
      - main
  schedule:
    # Run after MaxMind's Tuesday and Friday GeoLite2 database updates.
    - cron: "0 12 * * 3,6"
  workflow_dispatch:

env:
  DOCKER_ORG: public.ecr.aws/cds-snc
  DOCKER_SLUG: public.ecr.aws/cds-snc/notify-ipv4-geolocate-webservice

permissions:
  id-token: write
  contents: read

concurrency:
  group: ipv4-image-publish
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: Build and push
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: Set RELEASE_TAG environment variable
      run: echo "RELEASE_TAG=${GITHUB_SHA::7}-$(date -u '+%Y%m%dT%H%M%SZ')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

    - name: Install AWS CLI
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -q awscliv2.zip
        sudo ./aws/install --update
        aws --version

    - name: Configure credentials to CDS public ECR using OIDC
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
      with:
        role-to-assume: arn:aws:iam::283582579564:role/ipv4-geolocate-webservice-apply
        role-session-name: Ipv4GeolocateWebserviceGitHubActions
        aws-region: "us-east-1"
  
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      with:
        registry-type: public

    - name: Build
      run: |
        docker build --build-arg LICENSE_KEY=${{ secrets.MAXMIND_LICENSE_KEY }} -t "$DOCKER_SLUG:$RELEASE_TAG" .

    - name: Publish
      run: |
        docker push "$DOCKER_SLUG:$RELEASE_TAG"

    - name: Update images in staging (Helm)
      env:
        MANIFESTS_WORKFLOW_TOKEN: ${{ secrets.MANIFESTS_WORKFLOW_TOKEN }}
      run: |
        curl --fail-with-body -sS -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $MANIFESTS_WORKFLOW_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/cds-snc/notification-manifests/dispatches \
          -d "$(jq -n --arg tag "$RELEASE_TAG" '{event_type: "update-docker-image", client_payload: {component: "IPV4", docker_tag: $tag}}')"
