name: Workflow failure

on:
  workflow_run:
    workflows:
      - "Build and publish IPv4 image"
      - "Nightly rebuild trigger"
    types:
      - completed
    branches:
      - main

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          FAILED_WORKFLOW: ${{ github.event.workflow.name }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          json="$(jq -n --arg name "$FAILED_WORKFLOW" --arg url "$FAILED_RUN_URL" \
            '{blocks:[{type:"section",text:{type:"mrkdwn",text:(":red_circle: GitHub workflow failed: <" + $url + "|" + $name + ">")}}]}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            -X POST -H 'Content-type: application/json' --data "$json" "$SLACK_WEBHOOK"
