name: Nightly rebuild trigger
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipv4-nightly-rebuild
  cancel-in-progress: false

# Commits a timestamp to main so the normal build runs on a new commit and
# publishes a fresh sha7-tagged image with the latest GeoLite2 database.
jobs:
  commit-rebuild-marker:
    runs-on: ubuntu-latest
    steps:
      - name: Obtain a Notify PR Bot GitHub App Installation Access Token
        run: |
          TOKEN="$(npx obtain-github-app-installation-access-token@1.1.0 ci ${{ secrets.PR_BOT_GITHUB_TOKEN }})"
          echo "::add-mask::$TOKEN"
          echo "GITHUB_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          token: ${{ env.GITHUB_TOKEN }}
          ref: main

      - name: Update rebuild marker
        run: date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/nightly-rebuild

      - name: Branch protection OFF
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        with:
          route: PUT /repos/:repository/branches/main/protection
          repository: ${{ github.repository }}
          required_status_checks: |
            null
          enforce_admins: |
            null
          required_pull_request_reviews: |
            null
          restrictions: |
            null
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - name: Commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const { repository } = await github.graphql(
              `query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  ref(qualifiedName: "refs/heads/main") { target { ... on Commit { oid } } }
                }
              }`,
              { owner, repo }
            );
            await github.graphql(
              `mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) { commit { oid } }
              }`,
              {
                input: {
                  branch: { repositoryNameWithOwner: `${owner}/${repo}`, branchName: "main" },
                  message: { headline: "chore: nightly rebuild for GeoLite2 database refresh" },
                  expectedHeadOid: repository.ref.target.oid,
                  fileChanges: {
                    additions: [{ path: ".github/nightly-rebuild", contents: fs.readFileSync(".github/nightly-rebuild").toString("base64") }],
                  },
                },
              }
            );

      - name: Branch protection ON
        if: always()
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        with:
          route: PUT /repos/:repository/branches/main/protection
          repository: ${{ github.repository }}
          required_status_checks: |
            strict: false
            contexts: []
          enforce_admins: |
            true
          required_pull_request_reviews: |
            required_approving_review_count: 1
          restrictions: |
            null
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
